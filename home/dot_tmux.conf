# ~/.tmux.conf -- managed by chezmoi. Built-in settings only, no plugin manager.

set -g default-terminal "screen-256color"
set -g prefix C-a

# 1-based numbering, so the leftmost window is prefix+1
set -g base-index 1
setw -g pane-base-index 1

set -g mouse on
set -g status-position top

# What tmux-sensible was actually worth: no ESC lag in vim, usable scrollback.
set -sg escape-time 0
set -g history-limit 50000

# splits that look like what they do
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

# session tree, sorted by name
bind s choose-tree -sZ -O name

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# vi-style copy mode; keep the selection after a mouse drag
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
